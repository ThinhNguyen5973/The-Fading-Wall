<script>
"use strict";
/* ====== THE FADING WALL — Phase 6, with the girl ====== */

// ---------- seeded PRNG ----------
function mulberry32(seed){
  return function(){
    seed|=0; seed=(seed+0x6D2B79F5)|0;
    let t=Math.imul(seed^(seed>>>15),1|seed);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

// ---------- seeded 1D value noise ----------
function makeNoise1D(rand){
  const v=new Float32Array(256);
  for(let i=0;i<256;i++) v[i]=rand()*2-1;
  return function(x){
    const i=Math.floor(x), f=x-i;
    const a=v[i&255], b=v[(i+1)&255];
    const u=f*f*(3-2*f);
    return a+(b-a)*u;
  };
}

// ---------- fingerprint sprite factory ----------
function fingerprintSprite(rand, W, type, strokeStyle){
  const H=Math.round(W*1.3);
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  const noise=makeNoise1D(rand);
  const phase=rand()*64;
  const amp=W*0.05;
  g.lineWidth=Math.max(1,W/24);
  g.lineCap='round';
  g.strokeStyle=strokeStyle;

  if(type==='whorl'){
    const cx=W*0.5, cy=H*0.44, gap=W/9, step=0.10, turns=4.2;
    const n=Math.ceil(turns*Math.PI*2/step);
    g.beginPath();
    for(let s=0;s<=n;s++){
      const t=s*step;
      const r=gap*t/(Math.PI*2)+noise(t*0.7+phase)*amp;
      const x=cx+Math.cos(t)*r;
      const y=cy+Math.sin(t)*r*1.30;
      s===0?g.moveTo(x,y):g.lineTo(x,y);
    }
    g.stroke();
  }
  else if(type==='loop'){
    const cx=W*0.92, cy=H*0.55, r0=W*0.14, gap=W/9;
    const count=Math.floor((W*0.95-r0)/gap);
    for(let j=0;j<=count;j++){
      const r=r0+j*gap;
      const a0=Math.PI*0.55, a1=Math.PI*1.9;
      const n=Math.ceil((a1-a0)/0.10);
      g.beginPath();
      for(let s=0;s<=n;s++){
        const a=a0+(a1-a0)*s/n;
        const rr=r+noise(a*1.4+phase)*amp;
        const x=cx+Math.cos(a)*rr;
        const y=cy+Math.sin(a)*rr;
        s===0?g.moveTo(x,y):g.lineTo(x,y);
      }
      g.stroke();
    }
  }
  else { // arch
    const c=H*1.15, r0=c-W*0.06, gap=W/9;
    const count=Math.floor((c-r0)/gap);
    for(let j=0;j<=count;j++){
      const r=r0-j*gap;
      if(r<=W*0.2) break;
      const aMax=Math.asin(Math.min(1,(W*0.62)/r));
      const n=Math.ceil((2*aMax)/0.10);
      g.beginPath();
      for(let s=0;s<=n;s++){
        const a=-aMax+2*aMax*s/n;
        const rr=r+noise(a*1.6+phase)*amp;
        const x=W/2+Math.sin(a)*rr;
        const y=c-Math.cos(a)*rr;
        s===0?g.moveTo(x,y):g.lineTo(x,y);
      }
      g.stroke();
    }
  }

  g.globalCompositeOperation='destination-in';
  g.beginPath();
  g.ellipse(W/2,H/2,W*0.48,H*0.48,0,0,Math.PI*2);
  g.fill();
  g.globalCompositeOperation='source-over';
  return cv;
}

// ---------- handprint sprite factory ----------
function handSprite(rand, scar){
  const W=100, H=130;
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  g.translate(W*0.5,H*0.60);
  g.rotate((rand()*2-1)*0.10);
  const col=scar?'hsla(42,10%,80%,0.5)':'hsla(45,88%,66%,0.95)';
  g.fillStyle=col; g.strokeStyle=col; g.lineCap='round';
  g.beginPath(); g.ellipse(0,14,25,29,0,0,Math.PI*2); g.fill();
  const F=[[-18,36],[-6,41],[6,36],[18,26]];
  for(const fa of F){
    const l=fa[1]+(rand()*2-1)*3;
    const a=(fa[0]+(rand()*2-1)*3)*Math.PI/180;
    g.lineWidth=11;
    g.beginPath();
    g.moveTo(Math.sin(a)*20,-12);
    g.quadraticCurveTo(Math.sin(a)*(23+l*0.35),-12-l*0.5,
                       Math.sin(a)*(26+l*0.7),-12-l);
    g.stroke();
  }
  const ta=(62+(rand()*2-1)*6)*Math.PI/180;
  g.lineWidth=13;
  g.beginPath();
  g.moveTo(Math.sin(ta)*8,20);
  g.quadraticCurveTo(Math.sin(ta)*26,6,Math.sin(ta)*40,-2);
  g.stroke();
  return cv;
}

// ---------- sprite pools ----------
const TYPES=['whorl','loop','arch'];
const HUES=[38,44,30,22,200];
const SIZES=[24,32,42];
const POOL={}, SCARPOOL={};
const HANDPOOL=[], HANDSCAR=[];
(function buildPool(){
  for(let ti=0;ti<3;ti++)
    for(let si=0;si<SIZES.length;si++){
      for(let hi=0;hi<HUES.length;hi++){
        const rand=mulberry32(1000+ti*97+si*13+hi*7);
        POOL[TYPES[ti]+si+'-'+hi]=fingerprintSprite(
          rand,SIZES[si],TYPES[ti],'hsla('+HUES[hi]+',85%,72%,0.95)');
      }
      const rand2=mulberry32(2000+ti*97+si*13);
      SCARPOOL[TYPES[ti]+si]=fingerprintSprite(
        rand2,SIZES[si],TYPES[ti],'hsla(42,10%,80%,0.5)');
    }
  for(let i=0;i<3;i++){
    HANDPOOL.push(handSprite(mulberry32(5000+i*17),false));
    HANDSCAR.push(handSprite(mulberry32(6000+i*17),true));
  }
})();

// ---------- THE GIRL: run (5 frames) + touch (3 frames) ----------
// Folders sit next to this file: run/1.png … 5.png, touch/1.png … 3.png.
// Her hand in the touch frames is at (310,100) inside the 496x661 image —
// every press, flare, hold and the cursor anchor to that exact point.
const IMG_EXT='.png';
const GIRL_W=496, GIRL_H=661, HAND_X=310, HAND_Y=100;
const ASSETS={ok:false,failed:false,run:[],touch:[],loaded:0,total:0};
(function loadGirl(){
  const files=[];
  for(let i=1;i<=5;i++) files.push(['run',i]);
  for(let i=1;i<=3;i++) files.push(['touch',i]);
  ASSETS.total=files.length;
  for(const f of files){
    const img=new Image();
    img.onload=()=>{ ASSETS.loaded++; if(ASSETS.loaded===ASSETS.total) ASSETS.ok=true; };
    img.onerror=()=>{ ASSETS.failed=true; };
    img.src=f[0]+'/'+f[1]+IMG_EXT;
    ASSETS[f[0]].push(img);
  }
})();

// ---------- canvas + lightmap + cached glows ----------

const ctx=canvas.getContext('2d');
let vw=0, vh=0, dpr=1;
let LM=null, lctx=null, lmW=0, lmH=0;

function buildLightmap(){

window.addEventListener('resize',resize); resize();

function glowSprite(R, rgb){
  const c=document.createElement('canvas'); c.width=c.height=R*2;
  const g=c.getContext('2d');
  const rg=g.createRadialGradient(R,R,0,R,R,R);
  rg.addColorStop(0,'rgba('+rgb+',1)');
  rg.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=rg; g.fillRect(0,0,R*2,R*2);
  return c;
}

// ---------- sound: life is breath ----------
let AC=null, master=null, noiseBuf=null;
function armAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    const len=AC.sampleRate*2;
    noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=110; lp.Q.value=0.6;
    const dg=AC.createGain(); dg.gain.value=0.012;
    src.connect(lp); lp.connect(dg); dg.connect(master);
    src.start();
  }catch(e){}
}
function breath(kind, vol){
  vol=vol===undefined?1:vol;
  if(!AC||AC.state!=='running') return;
  const t=AC.currentTime;
  const src=AC.createBufferSource(); src.buffer=noiseBuf;
  src.playbackRate.value=0.9+Math.random()*0.2;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.9;
  const g=AC.createGain();
  let dur, v;
  if(kind==='deep'){
    dur=1.3; v=0.5*vol;
    bp.frequency.setValueAtTime(180,t);
    bp.frequency.exponentialRampToValueAtTime(900,t+dur*0.7);
    bp.frequency.exponentialRampToValueAtTime(320,t+dur);
    const o=AC.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(58,t);
    o.frequency.exponentialRampToValueAtTime(40,t+0.5);
    const og=AC.createGain(); og.gain.setValueAtTime(0.22*vol,t);
    og.gain.exponentialRampToValueAtTime(0.001,t+0.6);
    o.connect(og); og.connect(master); o.start(t); o.stop(t+0.65);
  }
  else if(kind==='die'){
    dur=0.5; v=0.10*vol;
    bp.frequency.setValueAtTime(700,t);
    bp.frequency.exponentialRampToValueAtTime(180,t+dur);
  }
  else {
    dur=0.6; v=0.16*vol;
    bp.frequency.setValueAtTime(240,t);
    bp.frequency.exponentialRampToValueAtTime(820,t+dur*0.6);
    bp.frequency.exponentialRampToValueAtTime(300,t+dur);
  }
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(v,t+dur*0.35);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(t); src.stop(t+dur+0.05);
}

// ---------- engine ----------
const pick=(r,a)=>a[(r()*a.length)|0];
function applyPron(t,male){
  return t.replace(/@s/g,male?'She':'He').replace(/@e/g,male?'she':'he')
          .replace(/@p/g,male?'her':'his').replace(/@o/g,male?'her':'him')
          .replace(/@r/g,male?'hers':'his');
}
function fill(r,t){
  return t.replace(/\{([A-Z]+)\}/g,(m,k)=>pick(r,SLOTS[k]));
}
function chooseKind(r,sizeKey){
  if(sizeKey===0 && r()<0.55) return CHILD;
  let total=0; for(const k of KINDS) total+=k.w;
  let x=r()*total;
  for(const k of KINDS){ x-=k.w; if(x<=0) return k; }
  return KINDS[0];
}
function profileFor(seed,sizeKey){
  const r=mulberry32(seed);
  const kind=chooseKind(r,sizeKey);
  return { hueIdx: pick(r,kind.hue) };
}
function storyFor(seed,sizeKey){
  const r=mulberry32(seed);
  const kind=chooseKind(r,sizeKey);
  const male=r()<0.5;
  const era=pick(r,ERAS);
  const ok=a=>a.filter(l=>!l.e||l.e.indexOf(era.k)>=0);
  const lines=[];
  if(r()<0.62){ const ns=ok(NAMES); if(ns.length) lines.push(pick(r,ns).t); }
  const lifes=ok(kind.LIFE);
  const n=(r()<0.35)?2:1;
  const first=pick(r,lifes); lines.push(first.t);
  if(n===2 && lifes.length>1){
    let second=first;
    while(second===first) second=pick(r,lifes);
    lines.push(second.t);
  }
  const tPool=(r()<0.55)?ok(kind.TOUCH):ok(SH_TOUCH);
  lines.push(pick(r,tPool).t);
  if(r()<0.22){ const cs=ok(r()<0.5?kind.CLOSE:SH_CLOSE); if(cs.length) lines.push(pick(r,cs).t); }
  return { era:era.t, name:'', lines:lines.map(t=>applyPron(fill(r,t),male)) };
}

// ---------- the wall: seeded chunks ----------
const CH=480;
const chunks=new Map();
function getChunk(i){
  if(chunks.has(i)) return chunks.get(i);
  const rand=mulberry32((i*2654435761)|0);
  const list=[];
  const now=performance.now();
  for(let k=0;k<22;k++){
    const typeR=rand();
    const type=typeR<0.42?'whorl':typeR<0.80?'loop':'arch';
    const sizeKey=rand()<0.35?0:(rand()<0.70?1:2);
    const seed=(rand()*1e9)|0;
    const prof=profileFor(seed,sizeKey);
    const hueIdx=prof.hueIdx;
    const lifespan=(12+rand()*18)*60000;
    const dying=rand()<0.06;
    const birth=now-(dying?lifespan*(0.93+rand()*0.06):lifespan*rand());
    list.push({ x:i*CH+rand()*CH, yFrac:0.12+rand()*0.76,
      type, sizeKey, hueIdx,
      birth, baseLifespan:lifespan, lifespan,
      ph:rand()*Math.PI*2, seed,
      flare:-1e9, h:0, readCount:0, dead:false });
  }
  chunks.set(i,list);
  return list;
}

// ---------- brightness ----------
let readingPrint=null;
function brightness(p,t){
  if(p.dead) return 0;
  const rem=1-(t-p.birth)/p.lifespan;
  if(p===readingPrint) return 0.92;
  if(rem<=0){ p.dead=true; return 0; }
  let b=Math.pow(rem,0.75);
  b*=1+0.25*p.h;
  b*=0.88+0.12*Math.sin(t*(0.0011+0.004*p.h)+p.ph);
  if(rem<0.07) b*=0.55+0.45*Math.abs(Math.sin(t*0.02+p.ph*7));
  b*=1+0.12*Math.min(p.readCount,2);
  if(p.isHand) b=Math.min(1,b*1.25);
  return b;
}

// ---------- ambient births ----------
function spawnBirth(t){
  const x=cam.x+Math.random()*(vw+CH*2)-CH;
  const i=Math.floor(x/CH);
  const list=getChunk(i);
  if(list.length>=46) return;
  const typeR=Math.random();
  const type=typeR<0.42?'whorl':typeR<0.80?'loop':'arch';
  const sizeKey=Math.random()<0.35?0:(Math.random()<0.70?1:2);
  const seed=(Math.random()*1e9)|0;
  const prof=profileFor(seed,sizeKey);
  const hueIdx=prof.hueIdx;
  const base=(12+Math.random()*18)*60000;
  list.push({ x, yFrac:0.12+Math.random()*0.76, type, sizeKey, hueIdx,
    birth:t, baseLifespan:base, lifespan:base,
    ph:Math.random()*Math.PI*2, seed,
    flare:t, h:0, readCount:0, dead:false });
  breath('flare',0.4);
}

// ---------- THE HANDS: persistence ----------
let hands=[];
function saveHands(){
  const data=hands.map(h=>({
    x:h.x, yFrac:h.yFrac, handV:h.handV,
    name:h.name, story:h.story, child:!!h.child,
    wallBirth:h.wallBirth, base:h.baseLifespan, life:h.lifespan,
    reads:h.readCount, dead:h.dead }));
  try{ localStorage.setItem('fadingWall_hands',JSON.stringify(data)); }catch(e){}
}
(function loadHands(){
  let data=[];
  try{ data=JSON.parse(localStorage.getItem('fadingWall_hands')||'[]'); }catch(e){ data=[]; }
  const now=performance.now(), wall=Date.now();
  for(const d of data){
    const h={
      isHand:true, handV:d.handV||0,
      x:d.x, yFrac:d.yFrac,
      name:d.name||'', story:d.story||'', child:!!d.child,
      wallBirth:d.wallBirth,
      baseLifespan:d.base, lifespan:d.life||d.base,
      birth:now-(wall-d.wallBirth),
      readCount:d.reads||0,
      dead:false, savedDead:false,
      flare:-1e9, h:0
    };
    if(h.birth+h.lifespan<=now){ h.dead=true; h.savedDead=true; }
    hands.push(h);
    getChunk(Math.floor(h.x/CH)).push(h);
  }
})();
function cullHands(){
  while(hands.length>60){
    let oldest=null;
    for(const h of hands) if(!h.child && h.dead && (!oldest||h.wallBirth<oldest.wallBirth)) oldest=h;
    if(!oldest) for(const h of hands) if(!h.child && (!oldest||h.wallBirth<oldest.wallBirth)) oldest=h;
    if(!oldest) break;
    const list=chunks.get(Math.floor(oldest.x/CH));
    if(list){ const ix=list.indexOf(oldest); if(ix>=0) list.splice(ix,1); }
    hands.splice(hands.indexOf(oldest),1);
  }
}
function addHand(wx,yFrac,name,story,child){
  const hand={
    isHand:true, handV:(Math.random()*3)|0,
    x:wx, yFrac:yFrac, name:name, story:story, child:!!child,
    wallBirth:Date.now(), birth:performance.now(),
    baseLifespan:3*24*3600*1000,
    flare:performance.now(), h:0,
    readCount:0, dead:false
  };
  hand.lifespan=hand.baseLifespan;
  hands.push(hand);
  getChunk(Math.floor(wx/CH)).push(hand);
  if(hands.length>60) cullHands();
  saveHands();
  return hand;
}
let bornAt=-1e9;
function createHand(sx,sy){
  const parX=-cam.par*30;
  const hand=addHand(sx+cam.x-parX,
    Math.min(0.92,Math.max(0.06,sy/vh)),'','',false);
  hand.sx=sx; hand.sy=sy;
  warmth=Math.min(1,warmth+0.3);
  breath('deep');
  bornAt=performance.now();
  if(KIOSK){
    hand.story=wallStory().join(' ');
    saveHands();
    openStory(hand,sx,sy);
  } else {
    openPanel(hand,sx,sy);
  }
}

function seedChild(){
  try{ if(localStorage.getItem('fadingWall_child')) return; }catch(e){ return; }
  const parX=-cam.par*30;
  addHand(pro.px+cam.x-parX,
    Math.min(0.92,Math.max(0.06,pro.py/vh)),'',
    "She came in the dark and pressed her hand flat against the rock, so the wall would have somewhere to start.",
    true);
  try{ localStorage.setItem('fadingWall_child','1'); }catch(e){}
}

// ---------- session: the wall watches how you read ----------
const sess={reads:0, saved:0, kinds:{}};
const KINDLABEL={keeper:"the keepers of small things",wanderer:"the wanderers",
 waited:"the ones who waited",maker:"the makers",mender:"the menders",
 laughter:"the ones who laughed",quiet:"the quiet ones",left:"the ones who left",
 stayed:"the ones who stayed",child:"the children"};
function wallStory(){
  const lines=[];
  if(sess.reads===0){
    lines.push("You pressed your hand to the rock without reading anyone first. Some do. The wall holds no grudge.");
  } else {
    lines.push("Tonight you read "+sess.reads+" of the remembered.");
    let fav=null,mx=0;
    for(const k in sess.kinds) if(sess.kinds[k]>mx){ mx=sess.kinds[k]; fav=k; }
    if(fav) lines.push("You stayed longest with "+(KINDLABEL[fav]||fav)+".");
    if(sess.saved>0) lines.push("You kept "+sess.saved+" of them burning.");
    lines.push("The wall noticed.");
  }
  lines.push("This is your print. It will fade like everyone's. Reading is how things last — come back for your own sometimes.");
  return lines;
}

/* ---------- THE PROLOGUE: the girl ----------
   dark → she runs in from the left → her hand lands on the press point →
   the touch cycle (reach, touch, press) as the warmth builds → the golden
   flare from her palm → she becomes the cursor. If the art fails to load,
   the abstract hand carries the story instead. */
const pro={phase:'dark', t0:performance.now(),
  gx:0, gy:0, gs:1, gi:0, k:0,
  px:0, py:0, pressQ:0, flareK:0,
  wave:false, waveT:0, t1:0, t2:0, doneT:0};

function girlScale(){ return Math.min(vh*0.5/GIRL_H, vw*0.55/GIRL_W); }
function cursorScale(){ return Math.min(vh*0.24/GIRL_H, vw*0.4/GIRL_W); }

function skipPrologue(){
  pro.phase='done'; pro.wave=false; pro.doneT=performance.now();
  seedChild();
}
function revealF(p,t){
  if(pro.phase==='done') return 1;
  if(pro.phase==='dark'||pro.phase==='hands'||pro.phase==='enter'||pro.phase==='press')
    return 0.06;
  const parX=-cam.par*30;
  const d=Math.hypot(p.x-cam.x+parX-pro.px, p.yFrac*vh-pro.py);
  const f=(t-pro.waveT-d/1.3)/700;
  return f<=0?0:Math.min(1,f);
}

function updatePrologue(t){
  if(pro.phase==='done') return;
  if(pro.phase==='dark'){
    if(t-pro.t0>2200 && (ASSETS.ok||ASSETS.failed)){
      pro.phase=ASSETS.ok?'enter':'hands'; pro.t1=t;
    }
    return;
  }
  const s=girlScale();
  pro.gs=s;
  pro.gy=vh*0.97-GIRL_H*s;
  if(pro.phase==='enter'){
    const e=Math.min(1,(t-pro.t1)/2600);
    const ee=1-(1-e)*(1-e);                    // she slows as she arrives
    const HTx=vw*0.62;
    const startX=-GIRL_W*s-30, endX=HTx-HAND_X*s;
    pro.gx=startX+(endX-startX)*ee;
    pro.gi=Math.floor((t-pro.t1)/110)%5;
    if(e>=1){ pro.phase='press'; pro.t1=t; }
  }
  else if(pro.phase==='hands'){                // fallback: the abstract hand
    const k=Math.min(1,(t-pro.t1)/2400);
    pro.k=k;
    const e=k*k*(3-2*k);
    pro.gx=vw*0.16+(vw*0.60-vw*0.16)*e;
    pro.gy=vh*1.12+(vh*0.50-vh*1.12)*e-Math.sin(k*Math.PI)*50;
    if(k>=1){ pro.phase='press'; pro.t1=t; }
  }
  else if(pro.phase==='press'){
    const q=Math.min(1,(t-pro.t1)/1500);
    pro.pressQ=q*q*(3-2*q);
    if(ASSETS.ok){
      pro.gx=vw*0.62-HAND_X*s;
      pro.gi=Math.min(2,Math.floor(q*3));      // reach → touch → press
      pro.px=pro.gx+HAND_X*s; pro.py=pro.gy+HAND_Y*s;
    } else {
      pro.px=vw*0.60; pro.py=vh*0.50;
    }
    if(q>=1){
      pro.phase='flare'; pro.t2=t;
      pro.wave=true; pro.waveT=t+350;
      warmth=1;
      breath('deep');
      seedChild();
    }
  }
  else if(pro.phase==='flare'){
    pro.flareK=Math.min(1,(t-pro.t2)/1800);
    if(ASSETS.ok) pro.gi=2;                    // she holds the pressed pose
    if(t>pro.waveT+Math.max(vw,vh)/1.3+700){
      pro.phase='done'; pro.wave=false; pro.doneT=t;
    }
  }
}

function drawGirl(img,x,y,s,alpha){
  if(!img) return;
  ctx.globalCompositeOperation='source-over';   // the only solid being
  ctx.globalAlpha=alpha;
  ctx.drawImage(img,x,y,Math.round(GIRL_W*s),Math.round(GIRL_H*s));
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='lighter';
}

function drawPrologue(t){
  if(pro.phase==='done'||pro.phase==='dark') return;
  if(!ASSETS.ok){                               // fallback: abstract hand
    if(pro.phase==='hands'||pro.phase==='enter'){
      ctx.globalAlpha=0.25;
      ctx.drawImage(PALMG,pro.gx-60,pro.gy-60,120,120);
      ctx.globalAlpha=0.9;
      ctx.drawImage(HANDPOOL[0],pro.gx-28,pro.gy-36,56,72);
      ctx.globalAlpha=1;
    }
    else if(pro.phase==='press'){
      ctx.globalAlpha=0.3+0.45*pro.pressQ;
      ctx.drawImage(HOLDG,pro.px-170,pro.py-170);
      ctx.strokeStyle='rgba(255,206,120,'+(0.35*pro.pressQ)+')';
      ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(pro.px,pro.py,26+120*pro.pressQ,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=0.95;
      ctx.drawImage(HANDPOOL[0],pro.px-30,pro.py-34,60,66);
      ctx.globalAlpha=1;
    }
    else if(pro.phase==='flare'){
      const k=pro.flareK;
      const R=120+Math.max(vw,vh)*1.2*k;
      const fg=ctx.createRadialGradient(pro.px,pro.py,0,pro.px,pro.py,R);
      fg.addColorStop(0,'rgba(255,214,130,'+(0.85*(1-k))+')');
      fg.addColorStop(1,'rgba(255,190,90,0)');
      ctx.fillStyle=fg; ctx.fillRect(pro.px-R,pro.py-R,R*2,R*2);
      ctx.globalAlpha=1-k;
      ctx.drawImage(HANDPOOL[0],pro.px-28,pro.py-36,56,72);
      ctx.globalAlpha=1;
    }
    return;
  }
  const s=pro.gs;
  if(pro.phase==='enter'){
    ctx.globalAlpha=0.18;                       // a soft light travels with her
    ctx.drawImage(PALMG,pro.gx+GIRL_W*0.5*s-70,pro.gy+GIRL_H*0.5*s-70,140,140);
    ctx.globalAlpha=1;
    drawGirl(ASSETS.run[pro.gi],pro.gx,pro.gy,s,1);
  }
  else if(pro.phase==='press'){
    ctx.globalAlpha=0.3+0.45*pro.pressQ;        // warmth builds at her palm
    ctx.drawImage(HOLDG,pro.px-170,pro.py-170);
    ctx.strokeStyle='rgba(255,206,120,'+(0.35*pro.pressQ)+')';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(pro.px,pro.py,26+120*pro.pressQ,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
    drawGirl(ASSETS.touch[pro.gi],pro.gx,pro.gy,s,1);
  }
  else if(pro.phase==='flare'){
    const k=pro.flareK;
    const R=120+Math.max(vw,vh)*1.2*k;
    const fg=ctx.createRadialGradient(pro.px,pro.py,0,pro.px,pro.py,R);
    fg.addColorStop(0,'rgba(255,214,130,'+(0.85*(1-k))+')');
    fg.addColorStop(1,'rgba(255,190,90,0)');
    ctx.fillStyle=fg; ctx.fillRect(pro.px-R,pro.py-R,R*2,R*2);
    drawGirl(ASSETS.touch[2],pro.gx,pro.gy,s,1-k);  // she fades into the wall's light
  }
}

// ---------- camera & input ----------
const cam={x:0, par:0};
const mouse={x:vw/2, y:vh/2};
const palm={x:vw/2, y:vh/2};
let lastInput=performance.now();
let dragging=false, dragX=0, downX=0, downY=0;
let dim=1, dimTarget=1, readingSince=0;
let warmth=0.55;
let hold=null;

window.addEventListener('wheel',e=>{
  if(pro.phase!=='done') return;
  cam.x+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*1.4;
  lastInput=performance.now();
},{passive:true});

function nearestPrintFrom(x,y,f){
  const parX=-cam.par*30;
  const i0=Math.floor((cam.x+parX)/CH)-1;
  const i1=Math.floor((cam.x+parX+vw)/CH)+1;
  let best=null, bd=1e9;
  for(let i=i0;i<=i1;i++)
    for(const p of getChunk(i)){
      if(p.dead) continue;
      const r=p.isHand?70:Math.max(22,SIZES[p.sizeKey]*f);
      const dx=p.x-cam.x+parX-x, dy=p.yFrac*vh-y;
      const d=dx*dx+dy*dy;
      if(d<r*r && d<bd){ bd=d; best=p; }
    }
  return best;
}

function nearestScarFrom(x,y){
  const parX=-cam.par*30;
  const i0=Math.floor((cam.x+parX)/CH)-1;
  const i1=Math.floor((cam.x+parX+vw)/CH)+1;
  let best=null, bd=1e9;
  for(let i=i0;i<=i1;i++)
    for(const p of getChunk(i)){
      if(!p.dead) continue;
      const r=p.isHand?60:Math.max(20,SIZES[p.sizeKey]*1.1);
      const dx=p.x-cam.x+parX-x, dy=p.yFrac*vh-y;
      const d=dx*dx+dy*dy;
      if(d<r*r && d<bd){ bd=d; best=p; }
    }
  return best;
}

canvas.addEventListener('contextmenu',e=>e.preventDefault());

canvas.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  armAudio();
  if(pro.phase!=='done'){ skipPrologue(); return; }
  dragging=true; dragX=e.clientX; downX=e.clientX; downY=e.clientY;
  lastInput=performance.now();
  if(!panelOpen) hold={x:e.clientX,y:e.clientY,start:performance.now()};
});
window.addEventListener('pointermove',e=>{
  mouse.x=e.clientX; mouse.y=e.clientY;
  if(hold && Math.hypot(e.clientX-hold.x,e.clientY-hold.y)>40){
    hold=null; dragX=e.clientX;
  }
  if(dragging && !hold){ cam.x-=(e.clientX-dragX)*1.6; dragX=e.clientX; }
  cam.par=(e.clientX/vw-0.5)*2;
  lastInput=performance.now();
});
canvas.addEventListener('pointerup',e=>{
  dragging=false;
  if(hold) hold=null;
  if(panelOpen) return;
  if(pro.phase!=='done') return;
  if(performance.now()-bornAt<600) return;
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>6) return;
  const hit=nearestPrintFrom(e.clientX,e.clientY,1.5);
  if(readingPrint){
    if(hit===readingPrint) closeStory();
    else if(hit) openStory(hit,e.clientX,e.clientY);
    else closeStory();
  } else if(hit){
    openStory(hit,e.clientX,e.clientY);
  } else {
    const sc=nearestScarFrom(e.clientX,e.clientY);
    if(sc){ sc.knockT=performance.now(); breath('die',0.35); }
  }
});

// ---------- the story card ----------
const storyEl=document.getElementById('story');
function openStory(p,sx,sy){
  closeStory();
  const t=performance.now();
  readingPrint=p;
  p.flare=t;
  dimTarget=0.5;
  readingSince=t;
  warmth=Math.min(1,warmth+0.06);
  breath('flare');
  if(!p.isHand) sess.reads++;
  const s=p.isHand?handStory(p):storyFor(p.seed,p.sizeKey);
  storyEl.innerHTML='';
  const era=document.createElement('div');
  era.className='era'; era.textContent=s.era;
  storyEl.appendChild(era);
  let di=0;
  if(s.name){
    const n=document.createElement('div');
    n.className='name'; n.textContent=s.name;
    n.style.transitionDelay=(0.1+(di++)*1.15)+'s';
    storyEl.appendChild(n);
  }
  s.lines.forEach(txt=>{
    const el=document.createElement('p');
    el.className='line';
    el.style.transitionDelay=(0.1+(di++)*1.15)+'s';
    el.textContent=txt;
    storyEl.appendChild(el);
  });
  storyEl.style.left=Math.min(Math.max(sx+34,12),Math.max(12,vw-330))+'px';
  storyEl.style.top=Math.min(Math.max(sy-24,12),Math.max(12,vh-240))+'px';
  requestAnimationFrame(()=>storyEl.classList.add('show'));
}
function handStory(p){
  const age=Date.now()-p.wallBirth;
  const era= age<86400000?'Today': age<172800000?'Yesterday'
           : age<604800000?'This week':'Not so long ago';
  const lines=[];
  if(p.story) p.story.split(/\n+/).forEach(l=>{ if(l.trim()) lines.push(l.trim()); });
  if(!p.name && !lines.length) lines.push('A hand was here. It wanted nothing said.');
  return {era, name:p.name, lines};
}
function closeStory(){
  if(!readingPrint) return;
  const t=performance.now(), p=readingPrint;
  if(t-readingSince>2000){
    p.readCount++;
    p.lifespan=Math.min(p.lifespan*1.25,p.baseLifespan*3);
    p.birth=t-p.lifespan*0.25;
    warmth=Math.min(1,warmth+0.05);
    if(p.isHand){ p.wallBirth=Date.now()-(t-p.birth); saveHands(); }
    else {
      sess.saved++;
      const k=chooseKind(mulberry32(p.seed),p.sizeKey).id;
      sess.kinds[k]=(sess.kinds[k]||0)+1;
    }
  }
  readingPrint=null; dimTarget=1;
  storyEl.classList.remove('show');
}

// ---------- the writing panel ----------
const panelEl=document.getElementById('panel');
const pName=document.getElementById('pName');
const pStory=document.getElementById('pStory');
let panelHand=null, panelOpen=false;
function openPanel(hand,sx,sy){
  panelHand=hand; panelOpen=true;
  pName.value=''; pStory.value='';
  panelEl.style.left=Math.min(Math.max(sx-140,12),Math.max(12,vw-316))+'px';
  panelEl.style.top=Math.min(Math.max(sy-30,12),Math.max(12,vh-280))+'px';
  panelEl.classList.add('show');
  setTimeout(()=>pName.focus(),60);
}
function savePanel(){
  if(!panelHand) return;
  const h=panelHand;
  h.name=pName.value.trim().slice(0,24);
  h.story=pStory.value.trim().slice(0,200);
  if(!h.story){ h.story=wallStory().join(' '); }
  saveHands();
  panelHand=null; panelOpen=false;
  panelEl.classList.remove('show');
  if(document.activeElement) document.activeElement.blur();
  openStory(h,h.sx,h.sy);
}
document.getElementById('pLeave').addEventListener('click',savePanel);
document.getElementById('pWall').addEventListener('click',()=>{
  pName.value=''; pStory.value=''; savePanel();
});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape' && panelOpen){ pName.value=''; pStory.value=''; savePanel(); }
});

// ---------- the loop ----------
let lastT=performance.now(), nextBirth=performance.now()+2500;
let scarHover=null, scarChangedAt=0, scarSounded=false;
let emaDt=16, Q=1, fc=0;

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) lastT=performance.now();
});

function frame(t){
  const dt=Math.min(120,t-lastT); lastT=t;
  emaDt+=(dt-emaDt)*0.03;
  if(emaDt>30 && Q===1) Q=0.5;
  else if(emaDt<20 && Q===0.5) Q=1;
  fc++;

  updatePrologue(t);

  if(pro.phase==='done' && t-lastInput>5000) cam.x+=dt*0.008;
  if(pro.phase==='done' && t>nextBirth){
    spawnBirth(t); nextBirth=t+1800+Math.random()*2600;
  }

  let holdQ=0, holdRaw=0;
  if(hold){
    const hp=(t-hold.start)/1300;
    holdRaw=hp;
    if(hp>=1){
      const hx=hold.x, hy=hold.y;
      hold=null;
      closeStory();
      createHand(hx,hy);
    }
    else {
      holdQ=hp*hp*(3-2*hp);
      warmth=Math.min(1,warmth+dt*0.00008);
    }
  }
  if(!readingPrint) dimTarget=(hold||panelOpen)?0.6:1;
  warmth+=(0.55-warmth)*Math.min(1,dt*0.00002);

  for(let i=0;i<hands.length;i++){
    const h=hands[i];
    if(h.dead && !h.savedDead){ h.savedDead=true; saveHands(); }
  }

  palm.x+=(mouse.x-palm.x)*0.12;
  palm.y+=(mouse.y-palm.y)*0.12;
  dim+=(dimTarget-dim)*0.06;

  ctx.clearRect(0,0,vw,vh);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=BGG; ctx.fillRect(0,0,vw,vh);

  const parX=-cam.par*30;
  const i0=Math.floor((cam.x+parX)/CH)-1;
  const i1=Math.floor((cam.x+parX+vw)/CH)+1;
  const scanning=!readingPrint && !hold && !panelOpen && pro.phase==='done';
  const hoverTarget=scanning?nearestPrintFrom(palm.x,palm.y,2.0):null;

  const scan=scanning?nearestScarFrom(palm.x,palm.y):null;
  if(scan!==scarHover){ scarHover=scan; scarChangedAt=t; scarSounded=false; }
  if(scarHover && !scarSounded && t-scarChangedAt>350){
    scarSounded=true;
    breath('die',0.22);
  }

  // pass 1: compute every print's light
  for(let i=i0;i<=i1;i++)
    for(const p of getChunk(i)){
      p.h+=(((p===hoverTarget)?1:0)-p.h)*0.12;
      const wasDead=p.dead;
      const b=brightness(p,t);
      if(p.dead && !wasDead) breath('die');
      p._b=b;
      p._rev=revealF(p,t);
      const fl=Math.exp(-(t-p.flare)/900);
      p._a=Math.min(1,b*(1+1.5*fl));
      p._scale=1+0.3*fl;
      if(p.dead){
        let sf=0;
        const gate=0.5+0.5*Math.sin(t*0.0013+p.ph*3);
        const wv=0.5+0.5*Math.sin(t*0.021+p.ph*9);
        if(p===scarHover) sf+=Math.pow(gate,4)*wv*0.30;
        if(p.knockT) sf+=Math.exp(-(t-p.knockT)/450)*0.45;
        p._sf=sf;
      }
    }

  // pass 2: the lightmap
  if(Q===1 || (fc&1)===0){
    lctx.clearRect(0,0,lmW,lmH);
    lctx.globalCompositeOperation='lighter';
    const sxr=lmW/vw, syr=lmH/vh;
    for(let i=i0;i<=i1;i++)
      for(const p of getChunk(i)){
        if(p.dead) continue;
        const aa=(p===readingPrint?1:dim)*p._rev;
        const base=Math.min(1,p._a*aa);
        if(base<=0) continue;
        const R=(p.isHand?230:SIZES[p.sizeKey]*4)*sxr;
        lctx.globalAlpha=base*0.5;
        const x=(p.x-cam.x+parX)*sxr, y=(p.yFrac*vh)*syr;
        lctx.drawImage(blob,x-R,y-R,R*2,R*2);
      }
    if(hold){
      const R=220*sxr;
      lctx.globalAlpha=0.25+0.45*holdQ;
      lctx.drawImage(blob,hold.x*sxr-R,hold.y*syr-R,R*2,R*2);
    }
    if(pro.phase==='press'){
      const R=220*sxr;
      lctx.globalAlpha=0.2+0.5*pro.pressQ;
      lctx.drawImage(blob,pro.px*sxr-R,pro.py*syr-R,R*2,R*2);
    }
    if(pro.phase==='enter'){                    // the wall warms where she runs
      const R=200*sxr;
      lctx.globalAlpha=0.16;
      lctx.drawImage(blob,(pro.gx+GIRL_W*0.5)*sxr-R,(pro.gy+GIRL_H*0.5)*syr-R,R*2,R*2);
    }
    if(pro.phase==='flare'){
      const R=300*sxr;
      lctx.globalAlpha=0.4*(1-pro.flareK);
      lctx.drawImage(blob,pro.px*sxr-R,pro.py*syr-R,R*2,R*2);
    }
  }
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.25+0.5*warmth;
  ctx.drawImage(LM,0,0,vw,vh);
  ctx.globalAlpha=1;

  // pass 2b: the shadows of the dead + the scars
  ctx.globalCompositeOperation='source-over';
  for(let i=i0;i<=i1;i++)
    for(const p of getChunk(i)){
      if(!p.dead) continue;
      const R=p.isHand?150:90;
      const x=p.x-cam.x+parX, y=p.yFrac*vh;
      ctx.globalAlpha=0.16*p._rev;
      ctx.drawImage(shade,x-R,y-R,R*2,R*2);
      const sc=p.isHand?HANDSCAR[p.handV]:SCARPOOL[p.type+p.sizeKey];
      ctx.globalAlpha=((p.isHand?0.08:0.07)+(p._sf||0))*p._rev;
      ctx.drawImage(sc,x-sc.width/2,y-sc.height/2);
    }
  ctx.globalAlpha=1;

  // pass 3: the living prints
  ctx.globalCompositeOperation='lighter';
  for(let i=i0;i<=i1;i++)
    for(const p of getChunk(i)){
      if(p.dead) continue;
      if(p._a<=0) continue;
      const s=p.isHand?HANDPOOL[p.handV]:POOL[p.type+p.sizeKey+'-'+p.hueIdx];
      const w=s.width*p._scale, h=s.height*p._scale;
      const sx=p.x-cam.x+parX, sy=p.yFrac*vh;
      const aa=(p===readingPrint?p._a:p._a*dim)*p._rev;
      if(Q===1){
        ctx.globalAlpha=aa*0.35;
        ctx.drawImage(s,sx-w*0.85,sy-h*0.85,w*1.7,h*1.7);
      }
      ctx.globalAlpha=aa;
      ctx.drawImage(s,sx-w/2,sy-h/2,w,h);
    }
  ctx.globalAlpha=1;

  // the prologue: the girl, or the hand she left
  drawPrologue(t);

  // the warmth of a held press — she reaches, touches, presses wherever you hold
  if(hold){
    ctx.globalAlpha=0.3+0.45*holdQ;
    ctx.drawImage(HOLDG,hold.x-170,hold.y-170);
    ctx.strokeStyle='rgba(255,206,120,'+(0.35*holdQ)+')';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(hold.x,hold.y,26+120*holdQ,0,Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha=1;
    if(ASSETS.ok){
      const cs=cursorScale();
      const idx=Math.min(2,Math.floor(holdRaw*3));
      drawGirl(ASSETS.touch[idx],hold.x-HAND_X*cs,hold.y-HAND_Y*cs,cs,1);
    }
  }

  // the cursor: she became you — her palm at your pointer
  const curA=pro.phase==='done'?Math.min(1,(t-pro.doneT)/900):0;
  if(curA>0 && !hold){
    if(ASSETS.ok){
      const cs=cursorScale();
      drawGirl(ASSETS.touch[2],palm.x-HAND_X*cs,palm.y-HAND_Y*cs,cs,0.85*curA);
      ctx.globalAlpha=0.35*curA;
      ctx.drawImage(PALMG,palm.x-70,palm.y-70);
      ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=0.12*curA;
      ctx.drawImage(HANDPOOL[0],palm.x-26,palm.y-34,52,68);
      ctx.globalAlpha=0.35*curA;
      ctx.drawImage(PALMG,palm.x-70,palm.y-70);
      ctx.globalAlpha=1;
    }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
